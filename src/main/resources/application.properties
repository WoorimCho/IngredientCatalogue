spring.application.name=IngredientCatalogue

server.port=${SERVER_PORT:8082}

# --- Datasource --------------------------------------------------------------
# Each catalogue owns its own schema; no shared tables, no cross-service FKs.
# createDatabaseIfNotExist keeps local dev a one-liner against the compose MySQL.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/ingredient_catalogue?allowPublicKeyRetrieval=true&useSSL=false&createDatabaseIfNotExist=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:myuser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:secret}

# --- Schema: Flyway owns it, Hibernate only validates -------------------------
# Migrations live in src/main/resources/db/migration (V1__init.sql, ...).
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# CSV bulk import (POST /api/ingredients/import)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# --- Spring Data REST ------------------------------------------------------------
# This service is a hand-written @RestController API, not auto-exposed
# repositories. Only surface repos explicitly annotated for Spring Data REST
# (none), and keep its base path off the API root just in case.
spring.data.rest.detection-strategy=annotated
spring.data.rest.base-path=/data

# --- Operations ---------------------------------------------------------------
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when-authorized

# --- Tracing -------------------------------------------------------------------
# Every request gets a trace id, propagated to downstream services and stamped
# into each log line; spans are reported to Zipkin. Sample everything in dev.
management.tracing.sampling.probability=${TRACING_SAMPLE_RATE:1.0}
management.zipkin.tracing.endpoint=${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

# The checked-in API contract is served statically at /openapi.yaml
# (src/main/resources/static/openapi.yaml).

# --- Inter-service auth (SECURITY.md C1/C2) ------------------------------------
# Writes under /api/** must carry an HMAC X-Internal-Auth header from the BFF /
# UI / crawler. The User service additionally checks the acting user matches the
# {id} in the path. Shared secret; set a real one in prod.
internal-auth.enabled=${INTERNAL_AUTH_ENABLED:true}
internal-auth.secret=${INTERNAL_AUTH_SECRET:dev-internal-secret-change-me}
